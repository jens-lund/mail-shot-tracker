name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    # Tracker data and uploaded media are read directly from GitHub. Editing the
    # project should not repeatedly cancel a website-code deployment.
    paths-ignore:
      - 'eternal-tomb/data/**'
      - 'eternal-tomb/uploads/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Static Pages publishing also works on this separate runner pool.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
